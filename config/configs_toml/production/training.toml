# Configuración de Training para CapibaraGPT v3
#
# CANONICAL: estos valores deben coincidir con config/config.yaml (training:).
# El trainer TPU puede cargarlos con TPUv6eConfig.from_toml(<este archivo>).

[training]
batch_size = 32
learning_rate = 3e-4        # pico; coseno hasta min_learning_rate
min_learning_rate = 3e-5    # 10% del pico
warmup_steps = 2000
max_steps = 100000
gradient_clip_norm = 1.0
weight_decay = 0.1
use_gradient_checkpointing = true
dropout = 0.0               # pretraining sin dropout
use_sequence_packing = true # empaquetar documentos, no pad-to-max

[validation]
eval_steps = 1000
save_steps = 5000
log_steps = 100
validation_batch_size = 16
max_validation_steps = 100

[optimization]
use_gradient_checkpointing = true
use_expert_weights_cache = true
use_tpu_optimized_gemm = true
use_tpu_memory_monitor = true
use_tpu_profiler = true

[distributed]
enable_distributed = true
gradient_accumulation_steps = 8   # efectivo = 32 x 8 = 256
num_microbatches = 4
use_sharding = true
